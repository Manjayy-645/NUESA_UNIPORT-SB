<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="seeesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A193F" />
      <stop offset="100%" stop-color="#0B2564" />
    </linearGradient>
    <linearGradient id="seeesGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="electricGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Crest Shield / Circle -->
  <circle cx="80" cy="80" r="76" fill="url(#seeesBg)" stroke="url(#seeesGold)" stroke-width="4" />
  <circle cx="80" cy="80" r="70" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4,2" />

  <!-- Circuit Ring Nodes -->
  <circle cx="80" cy="14" r="3" fill="#FACC15" />
  <circle cx="146" cy="80" r="3" fill="#FACC15" />
  <circle cx="80" cy="146" r="3" fill="#FACC15" />
  <circle cx="14" cy="80" r="3" fill="#FACC15" />

  <!-- Circuit Traces -->
  <path d="M 38 48 L 52 48 L 62 62 L 72 62" fill="none" stroke="url(#electricGlow)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="38" cy="48" r="2.5" fill="#60A5FA" />

  <path d="M 122 48 L 108 48 L 98 62 L 88 62" fill="none" stroke="url(#electricGlow)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="122" cy="48" r="2.5" fill="#60A5FA" />

  <!-- Central High-Voltage Lightning Bolt / Energy Core -->
  <polygon points="86,30 60,78 78,78 72,126 102,70 82,70" fill="url(#seeesGold)" filter="url(#glow)" />

  <!-- Resistor / Inductor Wave Emblem -->
  <path d="M 36 112 L 48 112 L 53 105 L 59 119 L 65 105 L 71 119 L 76 112 L 88 112" fill="none" stroke="#FACC15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- SEEES Text Banner -->
  <rect x="35" y="124" width="90" height="20" rx="4" fill="#0A193F" stroke="#F59E0B" stroke-width="1.5" />
  <text x="80" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FACC15" text-anchor="middle" letter-spacing="2">SEEES</text>
</svg>
